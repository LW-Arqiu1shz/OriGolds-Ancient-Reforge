plugins {
    id 'java-library'
    // 26.3 必须用 2.0.147+：2.0.146 固定 nfrt 2.0.27 → jst 2.0.10，
    // 反编译 MC 26.3 源码后 recompile 会在 HolderSet 报 "weaker access privileges"。
    // 2.0.148 固定 nfrt 2.0.31 → jst 2.0.11，26.3 才能编译通过。
    id 'net.neoforged.moddev' version '2.0.148'
}
// mod_version 末尾的 -rN 是构建轮次：jar 文件名保留 -rN，写进 neoforge.mods.toml 的版本号去掉 -rN。
def releaseVersion = (mod_version as String).replaceAll(/-r\d+$/, '')
// 构建轮次 -rN 只用于本机测试 jar 的文件名（成品\测试版本），不进 git、不上 GitHub：
// 轮次写在本目录不入库的 round.properties 里（mod_round=N）；没有这个文件时 jar 不带 -rN。
def roundFile = file('round.properties')
def roundProps = new Properties()
if (roundFile.exists()) { roundFile.withInputStream { roundProps.load(it) } }
def modRound = roundProps.getProperty('mod_round', '').trim()
version = modRound ? "${mod_version}-r${modRound}" : mod_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(25)
neoForge {
    version = project.neo_version
    runs { client { client() }; server { server(); programArgument '--nogui' } }
    mods { "${mod_id}" { sourceSet(sourceSets.main) } }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
processResources {
    def props = [minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
                 neo_version: neo_version, loader_version_range: loader_version_range,
                 mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: releaseVersion]
    inputs.properties props
    filteringCharset = 'UTF-8'
    filesMatching('META-INF/neoforge.mods.toml') { expand props }
}
