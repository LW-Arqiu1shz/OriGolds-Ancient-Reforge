modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Arqiu-owo"
logoFile="cover.png"
description='''为《金源工艺》添加了后期玩法和一大堆实（超）用（标）的小道具。体验随机数的乐，感受道具赛的爽！
Added a set of brand-new endgame mechanics to OriGolds mod, as well as some (overpowered) QOL props. Have fun with RNG and prop game!'''

[[mixins]]
config="origolds_ar.mixins.json"

[[dependencies.${mod_id}]]
modId="origolds"
type="required"
versionRange="[1.0.0,)"
ordering="AFTER"
side="BOTH"
[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"
[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"
